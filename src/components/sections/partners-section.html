<div class="partners-section ">
    <h2 class="components-title">University <span>Partners</span></h2>
    <div class="partners-section__top owl-carousel owl-theme">
        <div class="partners-section__top--item">
            <img src="../../images/partnors-t1.svg">
        </div>
        <div class="partners-section__top--item">
            <img src="../../images/partners-t2.svg">
        </div>
        <div class="partners-section__top--item">
            <img src="../../images/partners-t3.svg">
        </div>
        <div class="partners-section__top--item">
            <img src="../../images/partners-t4.svg">
        </div>
    </div>
    <div class="partners-section__bottom owl-carousel owl-theme">
        <div class="partners-section__bottom--item">
            <img src="../../images/partner-global.png">
        </div>
        <div class="partners-section__bottom--item">
            <img src="../../images/partners-b1.svg">
        </div>
        <div class="partners-section__bottom--item">
            <img src="../../images/partners-b2.svg">
        </div>
        <div class="partners-section__bottom--item">
            <img src="../../images/partners-b3.svg">
        </div>

    </div>
</div>
<script>

    $('.partners-section__top').owlCarousel({
        loop: true,
        margin: 16,
        nav: true,
        autoplay: true,
        autoplayTimeout: 0,
        responsive: {
            0: {
                items: 2
            },
            660: {
                items: 3
            },
            1000: {
                items: 4
            },
            1000: {
                items: 4
            }
        }
    })


    $('.partners-section__bottom').owlCarousel({
        loop: true,
        margin: 16,
        nav: true,
        autoplay: true,
        autoplayTimeout: 0,
        responsive: {
            0: {
                items: 2
            },
            660: {
                items: 3
            },
            1000: {
                items: 4
            },
            1000: {
                items: 4
            }
        }
    });
    $('.partners-section__top').on('mouseenter', function () {
        $(this).trigger('stop.owl.autoplay');
    }).on('mouseleave', function () {
        $(this).trigger('play.owl.autoplay', [1000]);
    });

</script>
